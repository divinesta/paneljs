name: paneljs-example-typeorm

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: paneljs-example-typeorm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paneljs_typeorm_example
    ports:
      - "5436:5432"
    volumes:
      - paneljs_typeorm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paneljs_typeorm_example"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  paneljs_typeorm_postgres_data:
